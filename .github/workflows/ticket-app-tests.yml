name: Ticket app CI

on: push

permissions:
        contents: read

jobs:
    runner-check:
        runs-on: ubuntu-24.04

        env:
            TICKET_DB_HOST: "127.0.0.1"
            TICKET_DB_PORT: "5432"
            TICKET_DB_NAME: "ticket_app_test"
            TICKET_DB_USER: "postgres"
            TICKET_DB_PASSWORD: "ci_test_password"


        services:
            postgres:
                image: postgres:18
                env:
                    PSOTGRES_DB: ticket_app_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: ci_test_password
                ports:
                    - "5432:5432"
                options: >-
                    --health-cmd "pg_isready -U postgres -d ticket_app_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                    python-version: "3.12"

            - name:  Show Python version
              run: python --version

            - name: Install dependencies
              run: python -m pip install -r ticket_app/requirements.txt

            - name: Check database connection
              run: python -m ticket_app.check_db_connection

            - name: Run first database test
              run: python -m pytest -q ticket_app/tests/test_day128_minimal.py